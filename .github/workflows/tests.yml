name: Package tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, zip, fileinfo, mbstring
          coverage: none
          tools: composer:v2
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-ara tesseract-ocr-chi-sim
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-interaction
      - run: composer test
      - run: bin/read-document examples/inspection.txt | diff - examples/inspection.json
